.r1{animation:r 8s linear infinite}.r2{animation:r 10s linear infinite -3s}.r3{animation:r 7s linear infinite -5s}.r4{animation:r 11s linear infinite -1s}.r5{animation:r 9s linear infinite -6s}.r6{animation:r 12s linear infinite -7s}.r7{animation:r 8.8s linear infinite -2s}.r8{animation:r 10.4s linear infinite -4s}.scan{animation:s 7s linear infinite}.p{animation:p 2.2s ease-in-out infinite}.d{stroke-dasharray:8 10;animation:d 12s linear infinite}
@keyframes r{0%{transform:translateY(-420px);opacity:0}8%{opacity:.55}90%{opacity:.25}100%{transform:translateY(620px);opacity:0}}@keyframes s{0%{transform:translateY(-25px);opacity:0}8%{opacity:.9}92%{opacity:.25}100%{transform:translateY(570px);opacity:0}}@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}@keyframes d{to{stroke-dashoffset:-190}}
</style></defs>
