<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Bakunity</title><desc id="desc">Bakunity company profile.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#010302"/><stop offset=".48" stop-color="#07100a"/><stop offset="1" stop-color="#020504"/></linearGradient>
<radialGradient id="core"><stop stop-color="#2cff88" stop-opacity=".2"/><stop offset=".55" stop-color="#2cff88" stop-opacity=".045"/><stop offset="1" stop-color="#2cff88" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="1"><stop stop-color="#2cff88" stop-opacity="0"/><stop offset=".5" stop-color="#d8ffe5"/><stop offset="1" stop-color="#2cff88" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
